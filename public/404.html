<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/nextplan/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NEXTPLAN — Plateforme pédagogique Planification et Contrôle (M1 MSI Paris 1)." />
    <meta name="theme-color" content="#F7F6FB" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=League+Spartan:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <title>NEXTPLAN — Redirection</title>
    <script type="text/javascript">
      (function() {
        var basePath = '/nextplan/';
        var l = window.location;
        var path = l.pathname;
        if (path.indexOf(basePath) === 0) {
          var rest = path.substring(basePath.length);
          if (rest.length > 0) {
            var newUrl = l.origin + basePath + '#/' + rest + l.search;
            l.replace(newUrl);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
